---
version: 3

images:
  base_image:
    # renovate: datasource=docker depName=registry.access.redhat.com/ubi9/ubi versioning=loose
    name: registry.access.redhat.com/ubi9/ubi:9.8-1793580630@sha256:8f989cc9270da6abec0144c22846ed1e6e92e462dc7768ce0981c4ac1d574733

dependencies:
  ansible_core:
    # renovate: datasource=pypi depName=ansible-core versioning=pep440
    package_pip: ansible-core==2.22.0
  ansible_runner:
    # renovate: datasource=pypi depName=ansible-runner versioning=pep440
    package_pip: ansible-runner==2.4.3
  python_interpreter:
    package_system: python3.12
    python_path: /usr/bin/python3.12
  galaxy: requirements.yml
  system: bindep.txt

options:
  package_manager_path: /usr/bin/dnf
  user: "1000"

additional_build_steps:
  # Pull fixed RPMs from UBI before installing the execution environment.
  append_base:
    - RUN $PKGMGR update -y && $PKGMGR clean all
  # The UBI bootstrap version has fixed High-severity vulnerabilities.
  append_final:
    # renovate: datasource=pypi depName=setuptools versioning=pep440
    - RUN $PYCMD -m pip install --no-cache-dir setuptools==84.2.1
