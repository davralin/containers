; LibreSpeed's upload worker sends 20 MiB chunks by default.
post_max_size = 32M
upload_max_filesize = 32M

; Keep all transient PHP files and sessions on the container's writable /tmp.
sys_temp_dir = /tmp
upload_tmp_dir = /tmp
session.save_path = /tmp

; This feature is unused by standalone LibreSpeed.
session.upload_progress.enabled = 0

expose_php = Off
