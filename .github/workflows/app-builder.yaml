---
name: App Builder

on:
  workflow_call:
    inputs:
      app:
        description: Application directory below apps/
        required: true
        type: string
      release:
        description: Publish a multi-architecture release
        required: true
        type: boolean

concurrency:
  group: ${{ inputs.release && format('app-builder-{0}', inputs.app) || format('app-builder-{0}-{1}', inputs.app, github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Cosign
        if: inputs.release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Set up QEMU
        if: inputs.release
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and smoke-test
        run: ./apps/${{ inputs.app }}/test.sh
      - name: Scan image with Trivy
        if: inputs.release
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          image-ref: local/${{ inputs.app }}:test
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
      - name: Publish Trivy results
        if: inputs.release
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ inputs.app }}
      - name: Scan image with Grype
        if: inputs.release
        id: grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: local/${{ inputs.app }}:test
          fail-build: false
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
          cache-db: true
      - name: Limit Grype SARIF severities
        if: inputs.release
        run: |
          jq '(.runs[].results) |= map(select(.level == "error"))' \
            "${{ steps.grype.outputs.sarif }}" > grype-results.sarif
      - name: Publish Grype results
        if: inputs.release
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: grype-results.sarif
          category: weekly-grype-${{ inputs.app }}
      - name: Get app version
        if: inputs.release
        id: version
        working-directory: apps/${{ inputs.app }}
        run: |
          if [[ -x ./version.sh ]]; then
            version="$(./version.sh)"
          else
            version="$(docker buildx bake --print --progress=quiet image | jq --raw-output '.target.image.labels["org.opencontainers.image.version"]')"
          fi
          test -n "$version" && test "$version" != "null"
          tag_version="${version//[^a-zA-Z0-9_.-]/-}"
          [[ "$tag_version" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]
          tags="davralin/${{ inputs.app }}:${tag_version},davralin/${{ inputs.app }}:rolling,davralin/${{ inputs.app }}:latest,ghcr.io/davralin/${{ inputs.app }}:${tag_version},ghcr.io/davralin/${{ inputs.app }}:rolling,ghcr.io/davralin/${{ inputs.app }}:latest"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag-version=%s\n' "$tag_version" >> "$GITHUB_OUTPUT"
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        if: inputs.release
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        if: inputs.release
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.LOCAL_GITHUB_TOKEN }}
      - name: Build and push
        if: inputs.release
        id: publish
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
          TAGS: ${{ steps.version.outputs.tags }}
        run: |
          cd apps/${{ inputs.app }}
          docker buildx bake --push --metadata-file "$RUNNER_TEMP/build-metadata.json" image-all
          digest="$(jq --raw-output '."image-all"["containerimage.digest"]' "$RUNNER_TEMP/build-metadata.json")"
          test -n "$digest" && test "$digest" != "null"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Sign images with Cosign
        if: inputs.release
        run: |
          images=(
            "docker.io/davralin/${{ inputs.app }}"
            "ghcr.io/davralin/${{ inputs.app }}"
          )
          for image in "${images[@]}"; do
            cosign sign --yes "$image@${{ steps.publish.outputs.digest }}"
          done
