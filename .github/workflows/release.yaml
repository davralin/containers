---
name: Release

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - ".github/workflows/app-builder.yaml"
      - ".github/workflows/release.yaml"
  workflow_dispatch:
    inputs:
      app:
        description: App directory below apps/
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changed-files.outputs.all_changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get changed apps
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          dir_names: true
          dir_names_exclude_current_dir: true
          dir_names_max_depth: 1
          escape_json: false
          json: true
          path: apps

  changed:
    if: needs.prepare.outputs.apps != '[]' || github.event_name == 'workflow_dispatch'
    name: Get changed apps
    needs:
      - prepare
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Select apps
        id: apps
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APPS: ${{ github.event_name == 'workflow_dispatch' && inputs.app || join(fromJSON(needs.prepare.outputs.apps), ' ') }}
        with:
          script: |
            const apps = process.env.APPS.split(' ').filter(Boolean);
            core.setOutput('apps', JSON.stringify(apps));
            console.log('apps:', JSON.stringify(apps));

  build:
    if: needs.changed.outputs.apps != '[]'
    name: Release ${{ matrix.app }}
    needs:
      - changed
    uses: ./.github/workflows/app-builder.yaml
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
    with:
      app: ${{ matrix.app }}
      release: true
    secrets: inherit
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app: ${{ fromJSON(needs.changed.outputs.apps) }}
