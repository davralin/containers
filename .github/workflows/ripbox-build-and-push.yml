name: ripbox

on:
  push:
    branches:
      - "main"

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.LOCAL_GITHUB_TOKEN }}
      - name: Build local image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ripbox/
          platforms: linux/amd64
          load: true
          tags: local/ripbox:scan
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          image-ref: local/ripbox:scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ripbox/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            davralin/ripbox:latest
            ghcr.io/davralin/ripbox:latest
      - name: Sign images with Cosign
        run: |
          cosign sign --yes ghcr.io/davralin/ripbox@${{ steps.build.outputs.digest }}
          cosign sign --yes docker.io/davralin/ripbox@${{ steps.build.outputs.digest }}
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/davralin/ripbox@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-spdx.json
      - name: Attest SBOM
        run: |
          cosign attest --yes --type spdxjson \
            --predicate sbom-spdx.json \
            ghcr.io/davralin/ripbox@${{ steps.build.outputs.digest }}
          cosign attest --yes --type spdxjson \
            --predicate sbom-spdx.json \
            docker.io/davralin/ripbox@${{ steps.build.outputs.digest }}
