---
name: Weekly Scan

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find apps
        id: apps
        shell: bash
        run: |
          apps=()
          for directory in apps/*; do
            test -f "$directory/docker-bake.hcl" || continue
            apps+=("${directory#apps/}")
          done
          apps="$(jq --compact-output --null-input '$ARGS.positional' --args "${apps[@]}")"
          printf 'apps=%s\n' "$apps" >> "$GITHUB_OUTPUT"

  scan:
    if: needs.prepare.outputs.apps != '[]'
    name: Scan ${{ matrix.app }}
    needs:
      - prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          image-ref: ghcr.io/davralin/${{ matrix.app }}:rolling
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
      - name: Publish Trivy results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-results.sarif
          category: weekly-trivy-${{ matrix.app }}
      - name: Scan image with Grype
        id: grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: ghcr.io/davralin/${{ matrix.app }}:rolling
          fail-build: false
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
          cache-db: true
      - name: Limit Grype SARIF severities
        run: |
          jq '(.runs[].results) |= map(select(.level == "error"))' \
            "${{ steps.grype.outputs.sarif }}" > grype-results.sarif
      - name: Publish Grype results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: grype-results.sarif
          category: weekly-grype-${{ matrix.app }}
